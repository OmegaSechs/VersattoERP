<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Veículos</title>
  <link rel="stylesheet" href="assets/css/CadVeiculos.css">
  <link rel="stylesheet" href="assets/css/HeaderFooter.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
  <div id="sidebar-container" class="sidebar">
    <button class="closebtn" onclick="toggleSidebar()">×</button>
  </div>

  <header class="header">
    <button class="openbtn" onclick="toggleSidebar()">☰</button>
    <h2>Cadastro de Veículos</h2>
    <img src="7124045_logout_icon.svg" alt="Logout" id="logout-icon"
         onclick="location.href='login.html'"
         style="cursor:pointer;width:30px;height:30px;" />
  </header>

  <main class="page">
    <div class="content">
      <h1>Cadastro de Veículos</h1><br />

      <form class="form-grid" id="formVeiculo">
        <!-- ID oculto do cliente para envio -->
        <input type="hidden" id="cliente-id-hidden" value="">

        <div class="input-group long">
          <label for="cliente">Cliente</label>
          <input type="text" id="cliente" placeholder="Digite o nome do cliente" />
        </div>

        <div class="input-group medium">
          <label for="marca">Marca</label>
          <input type="text" id="marca" />
        </div>

        <div class="input-group medium">
          <label for="modelo">Modelo</label>
          <input type="text" id="modelo" />
        </div>

        <div class="input-group short">
          <label for="ano">Ano</label>
          <input type="number" id="ano" min="1900" max="2100" />
        </div>

        <div class="input-group medium">
          <label for="placa">Placa *</label>
          <input type="text" id="placa" required />
        </div>

        <div class="input-group medium">
          <label for="cor">Cor</label>
          <input type="text" id="cor" />
        </div>

        <div class="input-group short">
          <label for="km">KM</label>
          <input type="number" id="km" min="0" />
        </div>

        <div class="input-group long">
          <label for="observacoes">Observações</label>
          <input type="text" id="observacoes" />
        </div>

        <div class="form-actions">
          <button class="form-button add" type="submit">Cadastrar Veículo</button>
          <button class="form-button return" type="button"
            onclick="location.href='listaVeiculos.html'">Retornar</button>
        </div>
      </form>
    </div>
  </main>

  <div id="footer-container"></div>
  <script src="assets/js/api.js"></script>
    <script src="assets/js/script.js"></script>
  <script src="assets/js/cadastrarVeiculo.js"></script>
</body>
</html>
