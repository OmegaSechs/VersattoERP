<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Versatto ERP — Login</title>
  <link rel="stylesheet" href="assets/css/login.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    .erro-msg {
      color: #c0392b;
      font-size: 14px;
      text-align: center;
      margin-top: 10px;
      min-height: 20px;
    }
    .submit-button:disabled { opacity: .6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Versatto ERP</h1>
    <h2>Acesso ao Sistema</h2>

    <div class="input-container">
      <input id="email" placeholder="E-mail" type="email" required autofocus>
      <img src="https://img.icons8.com/ios/30/user--v1.png" alt="Usuário" class="icon">
    </div>

    <div class="input-container">
      <input id="senha" placeholder="Senha" type="password" required>
      <img src="https://img.icons8.com/ios/30/lock--v1.png" alt="Senha" class="icon">
    </div>

    <p class="erro-msg" id="msgErro"></p>

    <button id="btnEntrar" class="submit-button" onclick="fazerLogin()">Entrar</button>
  </div>

  <script src="assets/js/api.js"></script>
  <script>
    // Se já estiver logado, vai direto para Home
    if (localStorage.getItem('versatto_usuario')) {
      window.location.href = 'Home.html';
    }

    async function fazerLogin() {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const btn   = document.getElementById('btnEntrar');
      const msg   = document.getElementById('msgErro');

      msg.textContent = '';
      if (!email || !senha) { msg.textContent = 'Preencha e-mail e senha.'; return; }

      btn.disabled    = true;
      btn.textContent = 'Entrando…';

      try {
        const resp = await fetch(`${API_BASE}/auth/login`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, senha }),
        });

        const data = await resp.json();

        if (resp.ok) {
          Auth.salvar(data.usuario, data.token);
          window.location.href = 'Home.html';
        } else {
          msg.textContent = data.erro || 'Credenciais inválidas.';
        }
      } catch {
        msg.textContent = 'Erro de conexão com o servidor.';
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Entrar';
      }
    }

    // Enter no campo senha dispara login
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') fazerLogin();
    });
  </script>
</body>
</html>
