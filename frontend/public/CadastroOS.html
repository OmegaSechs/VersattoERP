<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de OS/Orçamento</title>
    <link rel="stylesheet" href="assets/css/CadProdutos.css">
    <link rel="stylesheet" href="assets/css/HeaderFooter.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        .input-row, .input-row2 { display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px; }
        .input-group.w100 { width:100%; }
        .input-group.w50  { width:calc(50% - 8px); min-width:200px; }

        /* label sempre flutuada para inputs de data e hora */
        .input-group input[type="date"] + label,
        .input-group input[type="time"] + label {
            top: -10px;
            font-size: 11px;
            color: black;
            background-color: whitesmoke;
        }

        .selectPecas { margin-bottom:16px; }
        .selectPecas select { padding:10px;font-size:1rem;width:100%;border-radius:6px;border:1px solid #ccc; }
        .item-list { margin-top:24px; }
        #itens-table { width:100%;border-collapse:collapse; }
        #itens-table th, #itens-table td { padding:8px 12px;border:1px solid #ddd;text-align:left; }
        #itens-table th { background:#f4f4f4;font-weight:bold; }
        @media (max-width:700px) {
            .input-group.w50, .input-group.w100 { width:100%; }
        }
    </style>
</head>
<body>
    <div id="sidebar-container" class="sidebar">
        <button class="closebtn" onclick="toggleSidebar()">×</button>
    </div>
    <header class="header">
        <button class="openbtn" onclick="toggleSidebar()">☰</button>
        <h4>Ordens de Serviço</h4>
        <img src="7124045_logout_icon.svg" alt="Logout" id="logout-icon"
            onclick="window.location.href='login.html'"
            style="cursor: pointer; width: 30px; height: 30px;">
    </header>
    <main class="page">
        <div class="content">
            <h2>Cadastro de OS/Orçamento</h2>
            <form id="formOS">
                <!-- IDs ocultos -->
                <input type="hidden" id="cliente-id-os" value="">
                <input type="hidden" id="veiculo-id-os" value="">

                <div class="input-row">
                    <div class="input-group w100">
                        <input type="text" id="nome" name="nome" placeholder=" " required>
                        <label for="nome">Nome do Cliente *</label>
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group w100">
                        <input type="text" id="endereco" name="endereco" placeholder=" ">
                        <label for="endereco">Endereço</label>
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group w50">
                        <input type="text" id="cpf" name="cpf" placeholder=" ">
                        <label for="cpf">CPF/CNPJ</label>
                    </div>
                    <div class="input-group w50">
                        <input type="text" id="telefone" name="telefone" placeholder=" ">
                        <label for="telefone">Telefone</label>
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group w50">
                        <input type="text" id="veiculo" name="veiculo" placeholder=" " required>
                        <label for="veiculo">Veículo *</label>
                    </div>
                    <div class="input-group w50">
                        <input type="text" id="placa" name="placa" placeholder=" " required>
                        <label for="placa">Placa *</label>
                    </div>
                </div>
                <div class="input-row2">
                    <div class="input-group w50">
                        <input type="date" id="dataEntrada" name="dataEntrada" required>
                        <label for="dataEntrada">Data de Entrada *</label>
                    </div>
                    <div class="input-group w50">
                        <input type="date" id="dataSaida" name="dataSaida">
                        <label for="dataSaida">Data de Saída</label>
                    </div>
                    <div class="input-group w50">
                        <input type="time" id="horaEntrada" name="horaEntrada" required>
                        <label for="horaEntrada">Hora de Entrada *</label>
                    </div>
                    <div class="input-group w50">
                        <input type="time" id="horaSaida" name="horaSaida">
                        <label for="horaSaida">Hora de Saída</label>
                    </div>
                </div>
                <div class="selectPecas">
                    <select id="tipo" name="tipo" required onchange="onTipoChange(this.value)">
                        <option value="" disabled selected>Selecione o Tipo</option>
                        <option value="orcamento">Orçamento</option>
                        <option value="ordem_servico">Ordem de Serviço</option>
                    </select>
                </div>

                <!-- Parcelamento — visível apenas para Ordem de Serviço -->
                <div id="sec-parcelamento" style="display:none;margin-bottom:16px;border:1px solid #ccc;border-radius:6px;padding:16px;background:#fafafa;">
                    <h3 style="margin-bottom:12px;color:#2D3E50;font-size:15px;">💳 Parcelamento</h3>
                    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;">
                        <div>
                            <label style="display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:4px;">Nº de Parcelas</label>
                            <input type="number" id="parc-qtd" min="1" max="36" value="1" style="width:90px;padding:8px;border:1px solid #ccc;border-radius:4px;">
                        </div>
                        <div>
                            <label style="display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:4px;">Primeiro Vencimento</label>
                            <input type="date" id="parc-venc1" style="padding:8px;border:1px solid #ccc;border-radius:4px;">
                        </div>
                        <button type="button" onclick="gerarParcelasPreview()" style="padding:9px 18px;background:#2D3E50;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;">Gerar</button>
                    </div>
                    <div id="parcelas-preview" style="margin-top:12px;"></div>
                </div>

                <div class="input-group">
                    <button type="button" onclick="abrirModal()" style="padding:10px 20px;background:#2D3E50;color:#fff;border:none;border-radius:6px;cursor:pointer;">+ Adicionar Produto/Serviço</button>
                </div>
                <div class="item-list">
                    <h3>Itens na OS:</h3>
                    <table id="itens-table">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nome</th>
                                <th>Quantidade</th>
                                <th>Valor Unit.</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="input-group" style="margin-top:20px;">
                    <button class="return" type="button" onclick="window.location.href='listaOS.html'">Retornar</button>
                    <button class="add" type="submit">Cadastrar OS</button>
                </div>
            </form>
        </div>
    </main>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/cadastrarOS.js"></script>
</body>
<div id="footer-container"></div>
</html>
