<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Impressão OS — Versatto ERP</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; font-size: 13px; color: #000; background: #f5f5f5; }
    .page { background: #fff; width: 210mm; min-height: 297mm; margin: 20px auto; padding: 15mm 15mm 10mm; }

    /* ── Cabeçalho ── */
    .cabecalho { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #2D3E50; padding-bottom: 12px; margin-bottom: 16px; }
    .empresa-nome { font-size: 22px; font-weight: 700; color: #2D3E50; }
    .empresa-sub  { font-size: 12px; color: #555; margin-top: 2px; }
    .os-titulo { text-align: right; }
    .os-titulo h2 { font-size: 18px; color: #2D3E50; }
    .os-titulo .os-num { font-size: 28px; font-weight: 700; color: #2D3E50; }

    /* ── Blocos de info ── */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .bloco { border: 1px solid #ddd; border-radius: 4px; padding: 10px 14px; }
    .bloco h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #2D3E50; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
    .linha { display: flex; margin-bottom: 4px; }
    .linha .k { font-weight: 600; width: 120px; flex-shrink: 0; color: #444; }
    .linha .v { flex: 1; }

    /* ── Tabela de itens ── */
    .secao-itens { margin-bottom: 16px; }
    .secao-itens h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #2D3E50; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #2D3E50; color: #fff; padding: 7px 10px; text-align: left; font-size: 12px; }
    td { padding: 7px 10px; border-bottom: 1px solid #eee; font-size: 13px; }
    tr:last-child td { border-bottom: none; }
    .num { text-align: right; }

    /* ── Total ── */
    .total-box { display: flex; justify-content: flex-end; margin: 10px 0 20px; }
    .total-inner { border: 2px solid #2D3E50; border-radius: 6px; padding: 10px 20px; text-align: right; min-width: 220px; }
    .total-inner .label { font-size: 12px; color: #555; }
    .total-inner .valor { font-size: 24px; font-weight: 700; color: #2D3E50; }

    /* ── Observações / assinaturas ── */
    .obs-box { border: 1px solid #ddd; border-radius: 4px; padding: 10px 14px; margin-bottom: 20px; min-height: 60px; }
    .obs-box h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #2D3E50; margin-bottom: 6px; }
    .assinaturas { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 30px; }
    .assinatura { border-top: 1px solid #000; padding-top: 6px; text-align: center; font-size: 12px; color: #555; }

    /* ── Status badge ── */
    .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; }
    .badge-aberta       { background:#fff3cd; color:#856404; }
    .badge-em_andamento { background:#cce5ff; color:#004085; }
    .badge-concluida    { background:#d4edda; color:#155724; }
    .badge-cancelada    { background:#f8d7da; color:#721c24; }

    /* ── Botão imprimir (não aparece na impressão) ── */
    .no-print { text-align: center; padding: 16px; }
    .btn-print { padding: 10px 28px; background: #2D3E50; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; margin-right: 8px; }
    .btn-voltar { padding: 10px 28px; background: #ccc; color: #333; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }

    @media print {
      body { background: #fff; }
      .page { margin: 0; padding: 10mm; width: 100%; box-shadow: none; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="no-print">
    <button class="btn-print" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
    <button class="btn-voltar" onclick="history.back()">← Voltar</button>
  </div>

  <div class="page" id="pagina">
    <div id="carregando" style="text-align:center;padding:60px;color:#555;">⏳ Carregando OS…</div>
    <div id="conteudo" style="display:none;"></div>
  </div>

  <script src="assets/js/api.js"></script>
  <script>
    const brl = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const fmtData = s => { try { return new Date(s+'T00:00:00').toLocaleDateString('pt-BR'); } catch { return s||''; } };
    const statusLabel = { aberta:'Aberta', em_andamento:'Em Andamento', concluida:'Concluída', cancelada:'Cancelada' };
    const tipoLabel   = { orcamento:'Orçamento', ordem_servico:'Ordem de Serviço' };

    async function carregarOS() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) { document.getElementById('carregando').textContent = 'ID da OS não informado.'; return; }

      try {
        const r = await api.get(`/ordens-servico/${id}`);
        const os = await r.json();
        if (os.erro) { document.getElementById('carregando').textContent = 'OS não encontrada.'; return; }

        document.title = `OS #${os.os_id} — Versatto ERP`;

        const itens = os.itens || [];
        const valorTotal = itens.reduce((s,it) => s + (Number(it.subtotal)||0), 0) || Number(os.valor_total)||0;

        const html = `
          <div class="cabecalho">
            <div>
              <div class="empresa-nome">Versatto ERP</div>
              <div class="empresa-sub">Oficina Mecânica</div>
            </div>
            <div class="os-titulo">
              <h2>${tipoLabel[os.tipo]||os.tipo||'Ordem de Serviço'}</h2>
              <div class="os-num">#${os.os_id}</div>
              <span class="badge badge-${os.status||'aberta'}">${statusLabel[os.status]||os.status||'Aberta'}</span>
            </div>
          </div>

          <div class="info-grid">
            <div class="bloco">
              <h4>Cliente</h4>
              <div class="linha"><span class="k">Nome:</span><span class="v">${os.cliente_nome||'—'}</span></div>
              <div class="linha"><span class="k">CPF/CNPJ:</span><span class="v">${os.cpf_cnpj||'—'}</span></div>
              <div class="linha"><span class="k">Telefone:</span><span class="v">${os.telefone||os.celular||'—'}</span></div>
              <div class="linha"><span class="k">Endereço:</span><span class="v">${[os.rua,os.numero,os.bairro,os.cidade,os.estado].filter(Boolean).join(', ')||'—'}</span></div>
            </div>
            <div class="bloco">
              <h4>Veículo / Datas</h4>
              <div class="linha"><span class="k">Veículo:</span><span class="v">${os.veiculo||'—'}</span></div>
              <div class="linha"><span class="k">Placa:</span><span class="v">${os.placa||'—'}</span></div>
              <div class="linha"><span class="k">Entrada:</span><span class="v">${fmtData(os.os_dt_entrada)} ${os.os_hr_entrada||''}</span></div>
              <div class="linha"><span class="k">Saída:</span><span class="v">${os.os_dt_saida?fmtData(os.os_dt_saida)+' '+(os.os_hr_saida||''):'—'}</span></div>
            </div>
          </div>

          <div class="secao-itens">
            <h4>Serviços / Produtos</h4>
            <table>
              <thead>
                <tr><th>Item</th><th class="num">Qtd</th><th class="num">Val. Unit.</th><th class="num">Subtotal</th></tr>
              </thead>
              <tbody>
                ${itens.length
                  ? itens.map(it => `
                    <tr>
                      <td>${it.nome||'—'}</td>
                      <td class="num">${Number(it.quantidade).toFixed(1)}</td>
                      <td class="num">${brl(it.valor_unitario)}</td>
                      <td class="num">${brl(it.subtotal)}</td>
                    </tr>`).join('')
                  : '<tr><td colspan="4" style="color:#999;text-align:center;">Nenhum item registrado</td></tr>'
                }
              </tbody>
            </table>
          </div>

          <div class="total-box">
            <div class="total-inner">
              <div class="label">TOTAL</div>
              <div class="valor">${brl(valorTotal)}</div>
            </div>
          </div>

          ${os.observacoes ? `<div class="obs-box"><h4>Observações</h4><p>${os.observacoes}</p></div>` : ''}

          <div class="assinaturas">
            <div class="assinatura">Assinatura do Cliente</div>
            <div class="assinatura">Assinatura do Responsável</div>
          </div>`;

        document.getElementById('conteudo').innerHTML = html;
        document.getElementById('carregando').style.display = 'none';
        document.getElementById('conteudo').style.display   = 'block';
      } catch(err) {
        document.getElementById('carregando').textContent = 'Erro ao carregar: ' + err.message;
      }
    }

    window.addEventListener('DOMContentLoaded', carregarOS);
  </script>
</body>
</html>
